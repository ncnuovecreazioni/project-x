<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="index,follow"><title>PROJECT-X — Confronta software</title>
<style>
:root{--bg:#050711;--panel:#0e1524;--line:rgba(255,255,255,.1);--text:#f7f9ff;--muted:#98a5bc;--p:#7c5cff;--p2:#5b8cff;--ok:#36d99d}
*{box-sizing:border-box}body{margin:0;color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(circle at 10% 0%,rgba(124,92,255,.2),transparent 30%),linear-gradient(180deg,var(--bg),#0a0f1c);min-height:100vh}.wrap{width:min(1100px,calc(100% - 28px));margin:auto}.hero{padding:54px 0 24px}.tag{display:inline-block;padding:7px 10px;border:1px solid rgba(124,92,255,.35);border-radius:999px;color:#c9bfff;font-size:10px;font-weight:900}.hero h1{font-size:clamp(38px,7vw,68px);line-height:.98;letter-spacing:-.065em;margin:16px 0 10px}.hero p,.sub{color:var(--muted);line-height:1.65}.controls{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;margin:18px 0}.control{padding:13px;border:1px solid var(--line);border-radius:14px;background:#0b1220;color:#fff}.btn{border:0;border-radius:14px;padding:13px 17px;font-weight:900;color:#fff;background:linear-gradient(135deg,var(--p),var(--p2));cursor:pointer}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.card{background:rgba(14,21,36,.92);border:1px solid var(--line);border-radius:20px;padding:22px}.card h2{margin:0 0 4px}.price{color:#b8c2d7;font-size:11px}.metric{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:12px}.metric:last-child{border-bottom:0}.bar{height:8px;border-radius:999px;background:#192236;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--p),var(--p2));border-radius:999px}.cta{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.cta a{color:#fff;text-decoration:none;padding:10px 12px;border-radius:11px;border:1px solid var(--line);font-size:11px}.empty{grid-column:1/-1;padding:28px;border:1px dashed var(--line);border-radius:18px;color:var(--muted)}@media(max-width:720px){.controls,.grid{grid-template-columns:1fr}.hero{padding-top:34px}}
</style>
<link rel="stylesheet" href="/premium.css?v=20260919-accessibility-2"></head><body><main class="wrap"><section class="hero"><span class="tag">PROJECT-X · SMART COMPARISON</span><h1>Confronta due software.</h1><p>Seleziona due strumenti dal catalogo e guarda copertura, team, automazione, integrazioni e dati commerciali disponibili.</p></section>
<section class="controls"><select id="a" class="control"></select><select id="b" class="control"></select><button id="go" class="btn">Confronta →</button></section><div id="compareTools" style="display:flex;gap:8px;flex-wrap:wrap;margin:-6px 0 14px"></div>
<section id="out" class="grid"></section></main>
<script src="/database.js"></script><script src="/affiliate-registry.js"></script>
<script>
(function(){
"use strict";
var db=window.SOFTWARE_DATABASE||[], reg=window.PROJECTX_AFFILIATE_REGISTRY||{};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]})}
function toolId(t){return t&&t.id||''}
function find(id){return db.find(function(t){return toolId(t)===id})}
function fit(t){var n=Number(t&&t.compatibility);return Number.isFinite(n)?Math.round(n):0}
function avgNeeds(t){var n=t&&t.needs||{};var v=Object.keys(n).map(function(k){return Number(n[k])||0});return v.length?Math.round(v.reduce(function(a,b){return a+b},0)/v.length*10)/10:0}
function populate(){var s=[].concat(db).sort(function(x,y){return String(x.name).localeCompare(String(y.name),'it')});['a','b'].forEach(function(id){var el=document.getElementById(id);el.innerHTML=s.map(function(t){return '<option value="'+esc(t.id)+'">'+esc(t.name)+'</option>'}).join('')});var qs=new URLSearchParams(location.search);var x=qs.get('a'),y=qs.get('b');if(find(x))document.getElementById('a').value=x;if(find(y))document.getElementById('b').value=y;if(!find(x)&&s[0])document.getElementById('a').value=s[0].id;if(!find(y)&&s[1])document.getElementById('b').value=s[1].id;compare()}
function registryFor(t){return reg[toolId(t)]||null}
function card(t,label){var r=registryFor(t), needs=t.needs||{}, integrations=(t.integrations||[]).slice(0,6).join(', ')||'—', teams=(t.team||[]).join(', ')||'—', autos=(t.automation||[]).join(', ')||'—';var aff=r?'Disponibile':'Non disponibile';var href=r?('/api/affiliate?tool='+encodeURIComponent(toolId(t))+'&source=compare'):'';return '<article class="card"><div class="price">'+esc(label)+'</div><h2>'+esc(t.name||'Software')+'</h2><p class="sub">'+esc(t.category||'Software')+' · '+esc(t.description||'')+'</p><div class="metric"><span>Compatibilità</span><b>'+fit(t)+'%</b></div><div class="bar"><i style="width:'+fit(t)+'%"></i></div><div class="metric"><span>Copertura media catalogo</span><b>'+avgNeeds(t)+'/10</b></div><div class="metric"><span>Team</span><b>'+esc(teams)+'</b></div><div class="metric"><span>Automazione</span><b>'+esc(autos)+'</b></div><div class="metric"><span>Integrazioni</span><b>'+esc(integrations)+'</b></div><div class="metric"><span>Commerciale</span><b>'+aff+'</b></div><div class="cta">'+(href?'<a href="'+esc(href)+'">Apri offerta →</a>':'')+'<a href="'+esc(t.pricingUrl||'#')+'" target="_blank" rel="noopener">Prezzi →</a></div></article>'}
function compare(){
 var a=find(document.getElementById('a').value),b=find(document.getElementById('b').value);if(!a||!b)return;
 document.getElementById('out').innerHTML=card(a,'OPZIONE A')+card(b,'OPZIONE B');
 var share=location.origin+location.pathname+'?a='+encodeURIComponent(a.id)+'&b='+encodeURIComponent(b.id);
 document.getElementById('compareTools').innerHTML='<button id="copyCompare" class="btn" style="padding:9px 12px;font-size:9px">Copia confronto →</button><a class="btn" style="padding:9px 12px;font-size:9px;text-decoration:none" href="/?case=crm">Parti dal tuo problema →</a><span style="align-self:center;color:#718098;font-size:8px">Il confronto descrive i dati del catalogo: non è una classifica assoluta.</span>';
 document.getElementById('copyCompare').onclick=function(){
   var text='PROJECT-X — Confronto\\n\\nA: '+a.name+'\\nB: '+b.name+'\\n\\n'+location.href;
   function done(){this.textContent='Link copiato ✓';}
   if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(share).then(done.bind(this));
 };
}
document.getElementById('go').onclick=compare;populate();
})();
</script>
<script src="/human-layer.js"></script>
</body></html>
