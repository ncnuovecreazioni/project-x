<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>PROJECT-X — Affiliate Center</title>
<style>
:root{--bg:#050711;--panel:#0e1524;--line:rgba(255,255,255,.1);--text:#f7f9ff;--muted:#98a5bc;--p:#7c5cff;--p2:#5b8cff;--ok:#36d99d;--gold:#ffd166}
*{box-sizing:border-box}body{margin:0;color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(circle at 10% 0%,rgba(124,92,255,.2),transparent 30%),linear-gradient(180deg,var(--bg),#0a0f1c);min-height:100vh}.wrap{width:min(1100px,calc(100% - 28px));margin:auto}.hero{padding:72px 0 35px;text-align:center}.eyebrow{display:inline-block;padding:8px 11px;border:1px solid rgba(124,92,255,.35);border-radius:999px;color:#c9bfff;font-size:10px;font-weight:900}.hero h1{font-size:clamp(42px,7vw,72px);line-height:.95;letter-spacing:-.065em;margin:18px 0 12px}.grad{background:linear-gradient(100deg,#fff,#ad9dff,#79aaff);-webkit-background-clip:text;color:transparent}.hero p{color:var(--muted);max-width:790px;margin:auto;line-height:1.6}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;padding-bottom:50px}.card{background:rgba(14,21,36,.9);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 18px 55px rgba(0,0,0,.14)}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.top h2{margin:0;font-size:20px}.status{font-size:9px;padding:6px 9px;border-radius:999px;background:rgba(255,255,255,.05);color:#abb6c8}.status.ok{background:rgba(54,217,157,.08);color:#7ce8bd}.row{margin-top:10px;padding:12px;border:1px solid var(--line);border-radius:13px;background:rgba(255,255,255,.02);font-size:11px}.row b{display:block;margin-bottom:4px}.row code{font-size:10px;color:#c5bbff;word-break:break-all}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.stat{padding:11px;border:1px solid rgba(255,255,255,.07);border-radius:12px;background:rgba(255,255,255,.018)}.stat b{display:block;font-size:11px}.stat span{display:block;margin-top:3px;color:#78859c;font-size:9px;line-height:1.35}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.btn{display:inline-flex;text-decoration:none;border-radius:12px;padding:11px 13px;font-size:11px;font-weight:900;color:#fff;background:linear-gradient(135deg,var(--p),var(--p2))}.ghost{background:rgba(255,255,255,.04);border:1px solid var(--line)}.source{margin-top:9px;font-size:9px;color:#6f7c92}.source a{color:#a99dff;text-decoration:none}.note{grid-column:1/-1;border-color:rgba(54,217,157,.18);background:rgba(54,217,157,.045);line-height:1.65;color:var(--muted);font-size:11px}.note strong{color:#fff}@media(max-width:700px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<section class="hero">
<div class="eyebrow">PROJECT-X · MONETIZATION CENTER</div>
<h1>Attiva i tuoi <span class="grad">link affiliate</span>.</h1>
<p>Catalogo centrale dei programmi partner associati al Decision Engine. I dati commerciali servono alla monetizzazione e alla trasparenza, non modificano il ranking dei software.</p>
</section>
<section id="grid" class="grid"></section>
</div>
<script src="/affiliate-registry.js"></script>
<script>
(function(){
'use strict';
var registry=window.ProjectXAffiliateRegistry||{};
var box=document.getElementById('grid');
Object.keys(registry).forEach(function(k){
 var x=registry[k],card=document.createElement('article');card.className='card';
 card.innerHTML='<div class="top"><h2>'+x.name+'</h2><span class="status ok">VERIFICATO</span></div>'+
 '<div class="row"><b>Variabile Vercel</b><code>'+x.envKey+'</code></div>'+
 '<div class="stats">'+
 '<div class="stat"><b>'+String(x.commissionLabel||'Programma disponibile')+'</b><span>condizione commerciale pubblicata</span></div>'+
 '<div class="stat"><b>'+String(x.recurring?'Ricorrente':'Non ricorrente')+'</b><span>modello commissionale</span></div>'+ 
 '<div class="stat"><b>'+String(x.durationLabel||'—')+'</b><span>periodo / durata</span></div>'+ 
 '<div class="stat"><b>'+String(x.cookieDays?x.cookieDays+' giorni':'Non indicato')+'</b><span>cookie</span></div>'+ 
 '</div>'+ 
 '<div class="actions"><a class="btn" href="'+x.officialProgramUrl+'" target="_blank" rel="noopener">Apri programma →</a><a class="btn ghost" href="/api/affiliate?tool='+encodeURIComponent(x.id)+'&source=affiliate-center" target="_blank" rel="noopener">Testa route →</a></div>'+ 
 '<div class="source">Fonte: <a href="'+(x.sourceUrl||x.officialProgramUrl)+'" target="_blank" rel="noopener">pagina ufficiale</a></div>';
 box.appendChild(card);
});
var note=document.createElement('div');note.className='card note';note.innerHTML='<strong>Attivazione reale:</strong> candidati ai programmi, ottieni il tuo link personale e inseriscilo nella variabile Vercel indicata. La route di PROJECT-X registra il software cliccato e usa il link personale solo quando la relativa variabile è configurata; altrimenti effettua il fallback al sito ufficiale. Le condizioni dei provider possono cambiare e vanno ricontrollate prima dell’uso commerciale.';box.appendChild(note);
})();
</script>
</body>
</html>
