<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>PROJECT-X — Affiliate Center</title>
<style>
:root{--bg:#050711;--panel:#0e1524;--line:rgba(255,255,255,.1);--text:#f7f9ff;--muted:#98a5bc;--p:#7c5cff;--p2:#5b8cff;--ok:#36d99d}
*{box-sizing:border-box}body{margin:0;color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(circle at 10% 0%,rgba(124,92,255,.2),transparent 30%),linear-gradient(180deg,var(--bg),#0a0f1c);min-height:100vh}.wrap{width:min(1050px,calc(100% - 28px));margin:auto}.hero{padding:72px 0 35px;text-align:center}.eyebrow{display:inline-block;padding:8px 11px;border:1px solid rgba(124,92,255,.35);border-radius:999px;color:#c9bfff;font-size:10px;font-weight:900}.hero h1{font-size:clamp(42px,7vw,72px);line-height:.95;letter-spacing:-.065em;margin:18px 0 12px}.grad{background:linear-gradient(100deg,#fff,#ad9dff,#79aaff);-webkit-background-clip:text;color:transparent}.hero p{color:var(--muted);max-width:760px;margin:auto;line-height:1.6}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;padding-bottom:50px}.card{background:rgba(14,21,36,.9);border:1px solid var(--line);border-radius:22px;padding:22px}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.top h2{margin:0;font-size:20px}.status{font-size:9px;padding:6px 9px;border-radius:999px;background:rgba(255,255,255,.05);color:#abb6c8}.row{margin-top:14px;padding:12px;border:1px solid var(--line);border-radius:13px;background:rgba(255,255,255,.02);font-size:11px}.row b{display:block;margin-bottom:4px}.row code{font-size:10px;color:#c5bbff;word-break:break-all}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.btn{display:inline-flex;text-decoration:none;border-radius:12px;padding:11px 13px;font-size:11px;font-weight:900;color:#fff;background:linear-gradient(135deg,var(--p),var(--p2))}.ghost{background:rgba(255,255,255,.04);border:1px solid var(--line)}.note{grid-column:1/-1;border-color:rgba(54,217,157,.18);background:rgba(54,217,157,.045);line-height:1.65;color:var(--muted);font-size:11px}.note strong{color:#fff}@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<section class="hero">
<div class="eyebrow">PROJECT-X · MONETIZATION CENTER</div>
<h1>Attiva i tuoi <span class="grad">link affiliate</span>.</h1>
<p>PROJECT-X non inventa referral ID. Qui hai i programmi ufficiali verificati e il nome esatto della variabile Vercel da valorizzare quando vieni approvato.</p>
</section>
<section id="grid" class="grid"></section>
</div>
<script src="/affiliate-registry.js"></script>
<script>
(function(){
'use strict';
var registry=window.ProjectXAffiliateRegistry||{};
var box=document.getElementById('grid');
Object.keys(registry).forEach(function(k){
 var x=registry[k],card=document.createElement('article');card.className='card';
 card.innerHTML='<div class="top"><h2>'+x.name+'</h2><span class="status">ENV: '+x.envKey+'</span></div>'+
 '<div class="row"><b>Variabile Vercel</b><code>'+x.envKey+'</code></div>'+
 '<div class="actions"><a class="btn" href="'+x.officialProgramUrl+'" target="_blank" rel="noopener">Apri programma →</a><a class="btn ghost" href="/api/affiliate?tool='+encodeURIComponent(x.id)+'&source=affiliate-center" target="_blank" rel="noopener">Apri route tracking</a></div>';
 box.appendChild(card);
});
var note=document.createElement('div');note.className='card note';note.innerHTML='<strong>Come si attiva:</strong> candidati ai programmi, ottieni il tuo link univoco e inseriscilo nella variabile Vercel indicata. Il route di PROJECT-X registra il software cliccato e poi reindirizza al tuo link personale. Finché la variabile non è valorizzata, il sistema usa il sito ufficiale come fallback.';box.appendChild(note);
})();
</script>
</body>
</html>
