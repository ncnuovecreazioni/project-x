name: Fix PROJECT-X select UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-select:
    if: "!contains(github.event.head_commit.message, 'UI select fix')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Patch select styling and clean up workflow
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '.select{width:100%;padding:12px 13px;border:1px solid var(--line);background:rgba(255,255,255,.025);color:#fff;border-radius:14px;outline:none}'
          new = old + '.select{color-scheme:dark}.select option,.select optgroup{background:#0d1321;color:#fff}.select option:checked{background:#5b49b8;color:#fff}'
          if old not in s:
              raise SystemExit('select style not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          wf = Path('.github/workflows/fix-ui-select.yml')
          wf.unlink(missing_ok=True)

      - name: Commit UI fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/fix-ui-select.yml
          git commit -m "UI select fix"
          git push
