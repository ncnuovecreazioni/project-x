name: Wire PROJECT-X monetization UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject UI bridge
        shell: bash
        run: |
          set -e
          if grep -q '/affiliate-ui.js' index.html; then
            echo 'Affiliate UI bridge already present.'
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='</body>'
          if marker not in s:
              raise SystemExit('index.html: closing body tag not found')
          s=s.replace(marker, '  <script src="/affiliate-ui.js"></script>\n'+marker, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit and push
        shell: bash
        run: |
          git config user.name 'PROJECT-X Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git commit -m 'Wire affiliate tracking and Report PRO into results'
          git push
