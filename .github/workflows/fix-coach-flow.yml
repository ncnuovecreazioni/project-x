name: Fix PROJECT-X Coach flow

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Point Coach to result page
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('coach.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace("window.location.href='/#coach=1';", "window.location.href='/coach-result.html';")
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit and push
        shell: bash
        run: |
          git config user.name 'PROJECT-X Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add coach.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Complete PROJECT-X Coach result flow'
          git push
