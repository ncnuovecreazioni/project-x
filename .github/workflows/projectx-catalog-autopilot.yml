name: PROJECT-X Catalog Autopilot

on:
  schedule:
    - cron: "37 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: projectx-catalog-autopilot
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check provider catalog pages
        run: node scripts/update-catalog-health.mjs

      - name: Commit detected changes
        run: |
          if git diff --quiet -- catalog-health.json; then
            echo "No catalog change detected."
            exit 0
          fi

          git config user.name "PROJECT-X Autopilot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog-health.json
          git commit -m "chore: refresh catalog health"
          git push
