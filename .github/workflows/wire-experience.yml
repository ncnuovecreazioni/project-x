name: Wire Adaptive Experience

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wire experience loader
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('autopilot.js')
          s = p.read_text(encoding='utf-8')
          marker = "  function loadAdaptiveExperience() {"
          if marker in s:
              print('Adaptive Experience already wired')
              raise SystemExit(0)
          helper = '''  function loadAdaptiveExperience() {
            if (window.ProjectXAdaptive || document.querySelector('script[data-projectx-experience="1"]')) return;
            const script = document.createElement('script');
            script.src = '/experience.js';
            script.async = true;
            script.dataset.projectxExperience = '1';
            document.body.appendChild(script);
          }

'''
          needle = "  function start() {\n"
          if needle not in s:
              raise SystemExit('start() marker not found')
          s = s.replace(needle, helper + needle, 1)
          old = "  function start() {\n    trackBasicEvents();"
          new = "  function start() {\n    loadAdaptiveExperience();\n    trackBasicEvents();"
          if old not in s:
              raise SystemExit('start body marker not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit wiring
        run: |
          if git diff --quiet -- autopilot.js; then
            echo "No change needed"
            exit 0
          fi
          git config user.name "PROJECT-X Autopilot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add autopilot.js
          git commit -m "Wire Adaptive Experience into Autopilot"
          git push