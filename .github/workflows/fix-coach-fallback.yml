name: Fix PROJECT-X Coach fallback

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch deterministic Coach fallback
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('api/coach.js')
          s=p.read_text(encoding='utf-8')
          old='''function deterministicReply(answers, messages) {\n  const allUserText = messages.filter(function (m) { return m.role === "user"; }).map(function (m) { return m.content; }).join(" ");\n  const next = Object.assign({}, answers || {});\n  if (!next.businessType) next.businessType = inferBusiness(allUserText);\n  if (!Array.isArray(next.goals) || !next.goals.length) next.goals = inferGoals(allUserText);\n  if (!next.budget) next.budget = inferBudget(allUserText);\n'''
          new='''function deterministicReply(answers, messages) {\n  const allUserMessages = messages.filter(function (m) { return m.role === "user"; });\n  const allUserText = allUserMessages.map(function (m) { return m.content; }).join(" ");\n  const latestUser = allUserMessages.length ? allUserMessages[allUserMessages.length - 1].content : "";\n  const hadBusinessBeforeTurn = !!(answers && answers.businessType);\n  const next = Object.assign({}, answers || {});\n  if (!next.businessType) next.businessType = inferBusiness(allUserText);\n  if (!Array.isArray(next.goals) || !next.goals.length) next.goals = inferGoals(allUserText);\n  if (!next.budget) next.budget = inferBudget(allUserText);\n  if (!next.teamSize) next.teamSize = "2–5";\n  if (!next.painPoint && hadBusinessBeforeTurn && latestUser) next.painPoint = latestUser.slice(0, 800);\n'''
          if old not in s:
              raise SystemExit('fallback block not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and push
        shell: bash
        run: |
          git config user.name 'PROJECT-X Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add api/coach.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Harden PROJECT-X Coach fallback'
          git push
