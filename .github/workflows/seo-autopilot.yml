name: PROJECT-X SEO Autopilot

on:
  schedule:
    - cron: '37 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  grow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate next SEO page
        run: node scripts/seo-autopilot.mjs

      - name: Commit SEO growth
        run: |
          if git diff --quiet; then
            echo "No SEO changes."
            exit 0
          fi
          git config user.name "PROJECT-X Bot"
          git config user.email "actions@users.noreply.github.com"
          git add sitemap.xml *.html
          git add scripts seo-topics.json
          git commit -m "PROJECT-X SEO Autopilot: grow organic landing pages"
          git push
