<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>PROJECT-X — Verifica pagamento</title>
<style>:root{--bg:#050711;--text:#f7f9ff;--muted:#98a5bc;--p:#7c5cff;--p2:#5b8cff;--ok:#36d99d;--bad:#ff7285}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(circle at 50% 0%,rgba(124,92,255,.22),transparent 35%),linear-gradient(180deg,var(--bg),#0a0f1c)}.card{width:min(680px,calc(100% - 30px));padding:38px;border:1px solid rgba(255,255,255,.1);border-radius:26px;background:rgba(14,21,36,.94);text-align:center;box-shadow:0 30px 100px rgba(0,0,0,.35)}.icon{width:70px;height:70px;margin:0 auto 20px;border-radius:50%;display:grid;place-items:center;background:rgba(54,217,157,.1);border:1px solid rgba(54,217,157,.22);color:var(--ok);font-size:32px}.tag{display:inline-block;color:#8ff0c5;font-size:10px;font-weight:900;letter-spacing:.12em}.status{margin-top:16px;color:var(--muted);line-height:1.65;font-size:13px}.btn{display:inline-flex;margin-top:22px;padding:13px 16px;border-radius:12px;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;text-decoration:none;font-weight:900;font-size:11px}.secondary{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);margin-left:8px}.small{margin-top:18px;color:#718096;font-size:9px}.ok{color:var(--ok)}.bad{color:var(--bad)}@media(max-width:520px){.secondary{margin-left:0}}
</style></head><body><section class="card"><div class="icon" id="icon">✓</div><div class="tag" id="tag">PROJECT-X · VERIFICA PAGAMENTO</div><h1 id="title">Stiamo verificando il pagamento.</h1><p id="status" class="status">Controllo in corso sulla sessione Stripe.</p><a id="mainBtn" class="btn" href="/">Torna a PROJECT-X →</a><a class="btn secondary" href="/pro.html">Report PRO</a><div class="small">La pagina di successo non sostituisce la verifica server-side del pagamento.</div></section>
<script>
(async function(){
var sid=new URLSearchParams(location.search).get('session_id');
var title=document.getElementById('title'),status=document.getElementById('status'),btn=document.getElementById('mainBtn'),tag=document.getElementById('tag'),icon=document.getElementById('icon');
if(!sid){title.textContent='Ordine ricevuto.';status.textContent='Manca il riferimento della sessione Stripe. Il pagamento può essere comunque completato nel checkout, ma questa pagina non può verificarlo.';return;}
try{
 var r=await fetch('/api/stripe-session?session_id='+encodeURIComponent(sid),{cache:'no-store'}),d=await r.json();
 if(!r.ok||!d.success)throw new Error(d.error||'Verifica non disponibile');
 if(d.paid&&d.validProduct){
   tag.textContent='PROJECT-X · PAGAMENTO VERIFICATO';
   title.textContent='Pagamento verificato.';
   status.textContent='Il Report PRO è pronto. Abbiamo verificato la sessione Stripe e puoi aprire la tua blueprint personalizzata.';
   btn.href='/pro-delivery.html?session_id='+encodeURIComponent(sid);
   btn.textContent='Apri il mio Report PRO →';
   status.className='status ok';
   return;
 }
 tag.textContent='PROJECT-X · PAGAMENTO NON CONFERMATO';
 title.textContent='Pagamento non ancora confermato.';
 status.textContent='La sessione non risulta pagata oppure non corrisponde al Report PRO.';
 status.className='status bad';
}catch(e){
 title.textContent='Verifica temporaneamente non disponibile.';
 status.textContent='Il pagamento non viene considerato confermato da questa pagina finché la verifica server-side non riesce.';
 status.className='status bad';
}
})();
</script></body></html>
